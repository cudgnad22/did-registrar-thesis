spring.application.name=did-registration
server.port=8085
# Kết nối DB (khớp port thật sự dùng — đổi 5432 nếu bạn đổi port ở docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5435/did_registration
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true 
#  spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Module did:cheqd noi bo (thay cho Universal Registrar)
cheqd.module.url=http://127.0.0.1:3000
cheqd.module.timeout-seconds=60
