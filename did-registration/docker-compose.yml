services:
  postgres:
    image: postgres:14.1-alpine
    container_name: did-registration-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: did_registration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - did_pg_data:/var/lib/postgresql/data

volumes:
  did_pg_data: